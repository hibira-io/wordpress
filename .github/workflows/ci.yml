name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/js/hibira.js

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the plugin folder
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=hibira/ HEAD | tar -x -C dist
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/hibira
